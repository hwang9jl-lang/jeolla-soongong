<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>가보자 서울대!</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0A14">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="가보자 서울대!">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root { --bg: #0A0A14; --card: #12121F; --card2: #1A1C26; --line: #2A2A45; --purple: #B14BFF; --cyan: #00E5FF; --text: #F0F0F5; --text-dim: #8A8A9A; --text-mute: #5A5A6A; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .wrap { width: 100%; max-width: 400px; }
  .logo { text-align: center; margin-bottom: 28px; }
  .logo .t { font-size: 30px; font-weight: 800; text-shadow: 0 0 20px rgba(177,75,255,0.5); }
  .logo .s { font-size: 12px; color: var(--purple); letter-spacing: 4px; margin-top: 6px; }
  .card { background: var(--card); border-radius: 20px; padding: 26px 22px; }
  .card h2 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .card .desc { font-size: 13px; color: var(--text-dim); margin-bottom: 22px; line-height: 1.5; }
  label { display: block; font-size: 12px; color: var(--text-dim); letter-spacing: 1px; margin: 16px 0 8px; }
  label:first-of-type { margin-top: 0; }
  input { width: 100%; background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 16px; color: var(--text); outline: none; }
  input:focus { border-color: var(--purple); }
  input::placeholder { color: var(--text-mute); }
  .btn { width: 100%; margin-top: 22px; padding: 16px; background: linear-gradient(135deg, #B14BFF, #8A2BE2); border: none; border-radius: 14px; color: #fff; font-size: 16px; font-weight: 700; letter-spacing: 1px; cursor: pointer; box-shadow: 0 0 20px rgba(177,75,255,0.4); }
  .btn:active { transform: scale(0.98); }
  .msg { margin-top: 14px; padding: 11px 14px; border-radius: 10px; font-size: 13px; text-align: center; display: none; }
  .msg.err { display: block; background: #2A1418; border: 1px solid #5A2E38; color: #FF8BA5; }
  .foot { text-align: center; font-size: 12px; color: var(--text-mute); margin-top: 18px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><div class="t">가보자 서울대!</div><div class="s">순공 프로그램</div></div>
  <div class="card">
    <h2>내 순위 · 기록 보기</h2>
    <div class="desc">학번과 PIN으로 로그인하면 내 순위와 기록을 볼 수 있어요.</div>
    <label>학번</label>
    <input id="sid" type="tel" inputmode="numeric" maxlength="5" placeholder="학번 5자리">
    <label>PIN</label>
    <input id="pin" type="tel" inputmode="numeric" maxlength="4" placeholder="PIN 4자리">
    <div id="msg" class="msg"></div>
    <button class="btn" onclick="login()">랭킹 보기</button>
    <div class="foot">순공 시작·종료는 순공실 자리의 QR로만 가능합니다.<br>PIN은 첫 순공 시작 때 설정합니다.</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  ['sid','pin'].forEach(id => $(id).addEventListener('input', function(){ this.value = this.value.replace(/[^0-9]/g,''); }));

  async function login() {
    const sid = $('sid').value.trim();
    const pin = $('pin').value.trim();
    if (sid.length < 5 || pin.length < 4) { showErr('학번과 PIN을 정확히 입력하세요.'); return; }
    const snap = await db.ref('students/' + sid).get();
    if (!snap.exists()) { showErr('참여자 명단에 없는 학번입니다.'); return; }
    const s = snap.val();
    if (!s.pin) { showErr('아직 PIN을 설정하지 않았습니다.\n순공실에서 자리 QR로 먼저 시작해 주세요.'); return; }
    if (s.pin !== pin) { showErr('PIN이 올바르지 않습니다.'); return; }
    location.href = 'rank.html?sid=' + sid;
  }
  function showErr(m) { const el = $('msg'); el.textContent = m; el.className = 'msg err'; }
</script>
</body>
</html>
